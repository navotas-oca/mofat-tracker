<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOFAT Tracker | Office of the City Administrator, Navotas City</title>
<meta name="description" content="Track Food and Token Requests (MOFAT) handled by the Office of the City Administrator, City Government of Navotas.">
<meta name="theme-color" content="#03845d">

<script>
  // ===== SETTINGS =====
  // 1. The report's EMBED link (Looker Studio > File > Embed report > Embed URL)
  var REPORT_URL = 'https://lookerstudio.google.com/embed/reporting/cca2a0e7-a677-4994-8011-7b004f8b761e/page/DEQBG';
  // 2. Optional: a Google Analytics 4 Measurement ID (starts with G-) to count visits to this page.
  //    Leave as is to turn it off. (For what people do inside the report, use Looker Studio's own
  //    Report settings > Google Analytics Measurement ID instead.)
  var GA_ID = 'G-XXXXXXXXXX';
  // ====================

  if (/^G-[A-Z0-9]{6,}$/.test(GA_ID) && GA_ID !== 'G-XXXXXXXXXX') {
    var s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', GA_ID);
  }
</script>

<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body { font-family: "Google Sans Flex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; color: #6b6b6b; font-size: 14px; letter-spacing: .04em; text-align: center; padding: 16px; }
  .loading a { color: #03845d; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
  <div class="loading">
    <div>Loading the MOFAT Tracker…</div>
    <div><a id="direct" href="#">Open it directly</a> if it doesn't appear.</div>
  </div>
  <iframe id="report" title="MOFAT Tracker" allowfullscreen
          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  <script>
    document.getElementById('report').src = REPORT_URL;
    // "Open it directly" uses the normal (non-embed) report link
    document.getElementById('direct').href = REPORT_URL.replace('/embed/reporting/', '/reporting/');
  </script>
</body>
</html>
